<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skedula · 시간 배정 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#222b30;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header,main{max-width:1440px;margin:auto;padding:22px 4vw}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7d7cf;color:#546165}strong{font:italic bold 27px Georgia;color:#23312e}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.065em;margin:14px 0}p{color:#546165;line-height:1.55;margin:6px 0}article{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}section{background:#fff;border:1px solid #d9dcd4;border-radius:16px;padding:22px;min-width:0;display:flex;flex-direction:column}section:nth-child(2){--ink:#5c447d;--tint:#f2eef8}section{--ink:#24614c;--tint:#e9f3eb}section:nth-child(3){--ink:#854c27;--tint:#faf0e6}a{font-size:12px;color:var(--ink);text-underline-offset:3px}h2{font-size:23px;letter-spacing:-1px;margin:8px 0 0}.demo{margin:20px 0 16px;height:236px;display:flex;flex-direction:column;justify-content:center}.result{font-size:24px;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:0 0 12px;color:var(--ink)}button{font:inherit;cursor:pointer;background:#fff;border:1px solid #d1d6cf;border-radius:8px;padding:8px;color:inherit}button:hover{background:var(--tint)}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #3985be;outline-offset:2px}.apply{background:var(--ink);color:white;border:0}.apply:hover{background:var(--ink);filter:brightness(.92)}.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e0e2db;padding-top:14px;margin-top:auto}.foot output{font-size:13px;color:var(--ink)}.track{height:192px;position:relative;margin:10px 0 10px 40px;touch-action:none;user-select:none;cursor:crosshair}.line{position:absolute;border-top:1px solid #d8dfd7;width:100%;pointer-events:none}.line span{position:absolute;right:calc(100% + 5px);transform:translateY(-55%);font:11px monospace}.block{position:absolute;left:0;right:0;border-left:3px solid var(--ink);background:var(--tint);padding:1px 5px;overflow:hidden;font-size:12px;pointer-events:none}.fixed{background:#eeefed;border-color:#9ca59e}.dial{width:174px;height:174px;position:relative;border-radius:50%;background:var(--tint);margin:5px auto}.dial button{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;width:30px;height:30px;border-radius:50%;background:transparent}.dial button[aria-pressed=true]{background:var(--ink)}.dial:before{content:'';position:absolute;bottom:50%;left:50%;width:2px;height:64px;background:var(--ink);transform-origin:bottom;transform:rotate(var(--angle))}.segments,.chips{display:flex;justify-content:center;gap:5px}.segments button,.chips button{font-size:13px;padding:6px 10px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:14px}.slots button{font-variant-numeric:tabular-nums}.demo small{color:#5f6863;margin-top:8px}section>p{font-size:13px;min-height:40px}@media(max-width:900px){article{grid-template-columns:repeat(auto-fit,minmax(265px,1fr))}}
button:disabled{opacity:.36;cursor:default}.apply:disabled{background:#78817e}</style>
<header><strong>Skedula</strong><span>작업 시간 비교</span></header><main><h1>회신 보낼 시간, 어떻게 고를까요?</h1><p>오후 1시부터 5시 사이에 회신을 배정해 보세요. 치과 예약은 15:00–15:30입니다.</p>
<article>
<section><a href="https://support.apple.com/guide/calendar/add-modify-or-delete-events-icalwr13-events/mac" target="_blank">Apple Calendar ↗</a><h2>시간표에 그리기</h2><p>원하는 시작점에서 끝까지 드래그하세요.</p><div class="demo"><div class="track" tabindex="0" aria-label="시간표. 방향키로 이동, Shift와 방향키로 길이 변경"></div><small>↑ ↓ 이동 · Shift + ↑ ↓ 길이 조절</small></div><div class="result"></div><div class="foot"><button class="apply">배정하기</button><output></output></div></section>
<section><a href="https://m2.material.io/components/time-pickers/web" target="_blank">Material Design ↗</a><h2>시계로 맞추기</h2><p>오후 시각과 분을 차례로 찍어 시작을 정하세요.</p><div class="demo"><div class="segments"></div><div class="dial"></div><div class="chips"></div></div><div class="result"></div><div class="foot"><button class="apply">배정하기</button><output></output></div></section>
<section><a href="https://calendly.com/help/how-to-offer-time-slots-in-an-email" target="_blank">Calendly ↗</a><h2>빈 시간 고르기</h2><p>필요한 길이를 고르면 예약과 겹치지 않는 시작 시각이 나옵니다.</p><div class="demo"><div class="chips"></div><div class="slots"></div></div><div class="result"></div><div class="foot"><button class="apply">배정하기</button><output></output></div></section>
</article></main><script src="time-studies.js"></script></html>

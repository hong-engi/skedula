<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skedula · 오늘</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#233b34;background:#f5f5ee;font:15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{background:#163e34;color:white;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between}strong.brand{font: bold 25px Georgia;letter-spacing:-1px}main{max-width:1360px;margin:auto;padding:28px 5vw}h1{font-size:38px;letter-spacing:-2px;margin:0 0 5px}p{color:#5d6d63;margin:0}section{background:#fffefa;border:1px solid #d6dfd5;border-radius:16px;padding:22px;min-width:0}article{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}h2{font-size:21px;margin:0 0 16px}h3{font-size:13px;color:#56685b;margin:18px 0 5px}.row{padding:12px 0;border-top:1px solid #e3e7de}.line{display:flex;align-items:center;gap:9px}.line label{font-weight:650;overflow-wrap:anywhere}small{display:block;color:#607269;margin-top:4px}button,input,select{font:inherit}button{border:1px solid #c9d5cb;background:#fafbf6;color:#315b49;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px}button:hover{background:#e5efe4}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 24px}input[type=checkbox]{accent-color:#257055}time{font:14px monospace;color:#62776c}.slot{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;border-top:1px solid #e1e6dd;padding:9px 0;min-height:44px}.event{background:#e5efe3;padding:9px;border-left:3px solid #628664;border-radius:4px}.done{text-decoration:line-through;opacity:.65}dialog{border:1px solid #b9c9bb;border-radius:14px;padding:24px;color:inherit}dialog::backdrop{background:#173f3455}dialog label{display:block;margin:16px 0}dialog input{padding:5px}summary{cursor:pointer;font-weight:600;margin-top:14px}#add{float:right}@media(max-width:760px){main{padding:16px}section{padding:13px}article{gap:8px}}@media(max-width:560px){article{grid-template-columns:1fr}}
</style>
<header><strong class="brand">Skedula</strong><span>오늘의 계획</span></header><main><h1>오늘</h1><p id="date"></p><article><section><h2>시간표</h2><div id="timeline"></div></section><section><button id="add">＋ 할 일 추가</button><h2>할 일</h2><div id="tasks"></div></section></article></main>
<dialog id="editor"><form id="form"><h2 id="heading"></h2><label id="nameLabel">할 일 <input id="titleInput" maxlength="100"></label><div id="timing"><label>시작 <input type="time" id="start" required></label><label>작업 시간 <input type="number" id="minutes" min="1" max="1440" required> 분</label></div><button type="button" id="cancel">취소</button> <button>저장</button></form></dialog>
<script>
const el=id=>document.getElementById(id), now=new Date(), key='skedula-preview-v1-'+now.toLocaleDateString('sv-SE');
el('date').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
const seeds=[['회신 보내기','마감 임박','오늘 17:00 마감'],['제품 방향 문서 쓰기','중요한 일','중요 · 다음 달 마감'],['포트폴리오 정리','중요한 일','중요 · 마감 없음'],['사진 산책','버킷리스트','하고 싶은 일']];
let tasks=JSON.parse(localStorage.getItem(key)||'null')||seeds.map(([title,group,reason])=>({title,group,reason})), editing=null;
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn){const b=node('button',text);b.onclick=fn;return b}
function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}
function clock(m){return [Math.floor(m/60),m%60].map(v=>String(v).padStart(2,'0')).join(':')}
function range(t){return clock(t.at)+'–'+clock(t.at+t.len)}
function edit(t){editing=t;el('heading').textContent=t?t.title:'할 일 추가';el('timing').hidden=!t;el('nameLabel').hidden=!!t;el('titleInput').disabled=!!t;el('titleInput').required=!t;el('titleInput').value='';for(const id of ['start','minutes'])el(id).disabled=!t;el('start').value=clock(t?.at??660);el('minutes').value=t?.len??30;el('editor').showModal()}
el('cancel').onclick=()=>el('editor').close();el('add').onclick=()=>edit(null);
el('form').onsubmit=e=>{e.preventDefault();if(editing){const [h,m]=el('start').value.split(':').map(Number),at=h*60+m,len=Number(el('minutes').value);if(at+len>1440)return alert('오늘 안에 끝나는 시간을 선택하세요.');Object.assign(editing,{at,len,today:true})}else{const title=el('titleInput').value.trim();if(!title)return;tasks.push({title,group:'내 할 일',reason:'직접 추가',today:true})}el('editor').close();save()};
function render(){const list=el('tasks');list.replaceChildren();const groups=['오늘 고른 일','마감 임박','중요한 일','내 할 일','버킷리스트','완료'];for(const group of groups){const items=tasks.filter(t=>(t.done?'완료':t.today?'오늘 고른 일':t.group)===group);if(!items.length)continue;
list.append(node('h3',group));for(const t of items){const r=node('div',null,'row'),line=node('div',null,'line'),label=node('label'),check=node('input');check.type='checkbox';check.checked=!!t.done;check.onchange=()=>{t.done=check.checked;save()};label.append(check,' '+t.title);if(t.done)label.className='done';line.append(label);r.append(line,node('small',t.reason+(t.at!=null?' · 작업 '+range(t):'')));if(!t.done){const a=node('div',null,'actions');if(t.at==null)a.append(button(t.today?'오늘 선택 해제':'오늘로 고르기',()=>{t.today=!t.today;save()}));a.append(button(t.at==null?'시간 배정':'시간 변경',()=>edit(t)));if(t.at!=null)a.append(button('배정 취소',()=>{delete t.at;save()}));r.append(a)}list.append(r)}}
const grid=el('timeline');grid.replaceChildren();const events=[{title:'치과 예약',at:900,len:30,fixed:true},...tasks.filter(t=>t.at!=null)].sort((a,b)=>a.at-b.at);
const hours=[...new Set([...Array.from({length:10},(_,i)=>(9+i)*60),...events.map(t=>t.at)])].sort((a,b)=>a-b);
for(const at of hours){const row=node('div',null,'slot'),body=node('div');row.append(node('time',clock(at)),body);for(const t of events.filter(t=>t.at===at)){const card=node('div',null,'event');card.append(node('b',t.title,t.done?'done':''),node('small',range(t)+' · '+(t.fixed?'고정 일정':'작업 시간')));if(events.some(o=>o!==t&&o.at<t.at+t.len&&t.at<o.at+o.len))card.append(node('small','시간 겹침'));body.append(card)}grid.append(row)}}
render()
</script></html>
